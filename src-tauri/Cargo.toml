[package]
name = "seekye"
version = "0.1.0"
description = "SeekYe image search automation"
authors = ["SeekYe contributors"]
edition = "2021"

[lib]
name = "seekye_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
