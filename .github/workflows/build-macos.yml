name: SeekYe tagged desktop releases

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Verify architecture
        shell: bash
        run: test "$(uname -m)" = arm64
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test
      - name: Build macOS ARM64 bundles
        run: bun run tauri build --target aarch64-apple-darwin --bundles app,dmg
      - name: Collect macOS deliverables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          TARGET=src-tauri/target/aarch64-apple-darwin/release
          echo "Bundle output:"
          find "$TARGET" -maxdepth 5 \( -name '*.app' -o -name '*.dmg' -o -name 'seekye' \) -print || true
          APP="$(find "$TARGET/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo 'Missing macOS .app bundle. Ensure --bundles app,dmg is set.' >&2
            exit 1
          fi
          BIN="$APP/Contents/MacOS/seekye"
          test -f "$BIN" || { echo "Missing executable: $BIN" >&2; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/SeekYe-macOS-arm64.app.zip
          cp "$BIN" dist/seekye-macos-arm64
          chmod +x dist/seekye-macos-arm64
          find "$TARGET/bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -exec cp {} dist/SeekYe-macOS-arm64.dmg \;
          test -s dist/SeekYe-macOS-arm64.dmg
          (cd dist && shasum -a 256 SeekYe-macOS-arm64.app.zip seekye-macos-arm64 SeekYe-macOS-arm64.dmg > SHA256SUMS-macOS.txt)
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: seekye-macos-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  windows-x64:
    name: Build Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test
      - name: Ensure Windows icon exists
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $icon = 'src-tauri/icons/icon.ico'
          if (!(Test-Path $icon)) {
            Write-Host 'icon.ico missing from checkout. Generating from icon.png.'
            if (!(Test-Path 'src-tauri/icons/icon.png')) { throw 'Missing src-tauri/icons/icon.png' }
            python -m pip install --disable-pip-version-check Pillow
            python -c "from PIL import Image; im = Image.open('src-tauri/icons/icon.png').convert('RGBA'); im.save('src-tauri/icons/icon.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          }
          if (!(Test-Path $icon)) { throw "Windows icon still missing: $icon" }
          Get-Item $icon | Select-Object FullName, Length
      - name: Build Windows x64 NSIS installer
        run: bun run tauri build --target x86_64-pc-windows-msvc --bundles nsis
      - name: Validate and package Windows x64 binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          $target = 'src-tauri/target/x86_64-pc-windows-msvc/release'
          $binary = Join-Path $target 'seekye.exe'
          if (!(Test-Path $binary)) {
            Get-ChildItem 'src-tauri/target' -Recurse -Filter '*.exe' | Select-Object -ExpandProperty FullName
            throw "Missing Windows application executable: $binary"
          }

          # A successful Cargo build is not sufficient: verify that the output
          # is actually a 64-bit Windows executable before publishing it.
          function Assert-WindowsX64PE([string] $path) {
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $path).Path)
            if ($bytes.Length -lt 1024) { throw "Executable too small: $path" }
            if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
              throw "Not a Windows PE executable (missing MZ): $path"
            }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            if ($peOffset -lt 0x40 -or ($peOffset + 26) -ge $bytes.Length) {
              throw "Invalid PE offset: $path"
            }
            if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset+1] -ne 0x45 -or
                $bytes[$peOffset+2] -ne 0 -or $bytes[$peOffset+3] -ne 0) {
              throw "Missing PE signature: $path"
            }
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            $optionalMagic = [BitConverter]::ToUInt16($bytes, $peOffset + 24)
            if ($machine -ne 0x8664 -or $optionalMagic -ne 0x20B) {
              throw ('Expected PE32+ AMD64, got machine=0x{0:X4} magic=0x{1:X4}: {2}' -f $machine, $optionalMagic, $path)
            }
            Write-Host "Verified Windows PE32+ AMD64: $path ($($bytes.Length) bytes)"
          }

          Assert-WindowsX64PE $binary
          Copy-Item $binary 'dist/SeekYe-Windows-x64-portable.exe'
          Assert-WindowsX64PE 'dist/SeekYe-Windows-x64-portable.exe'

          $nsisPath = Join-Path $target 'bundle/nsis'
          if (!(Test-Path $nsisPath)) { throw "NSIS output folder missing: $nsisPath" }
          $installers = @(Get-ChildItem $nsisPath -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)" }
          # NSIS installers can use a 32-bit bootstrapper even when the app is x64.
          # Only the application executable must be PE32+ AMD64.
          Copy-Item $installers[0].FullName 'dist/SeekYe-Windows-x64-Setup.exe'

          # ZIP avoids ambiguous direct-EXE handling by download managers and
          # enables a clean extraction before launching.
          Compress-Archive -Path 'dist/SeekYe-Windows-x64-portable.exe' -DestinationPath 'dist/SeekYe-Windows-x64-portable.zip' -Force

          $releaseFiles = @(
            'dist/SeekYe-Windows-x64-portable.exe',
            'dist/SeekYe-Windows-x64-portable.zip',
            'dist/SeekYe-Windows-x64-Setup.exe'
          )
          $releaseFiles | ForEach-Object {
            $hash = Get-FileHash -Path $_ -Algorithm SHA256
            "$($hash.Hash.ToLower())  $(Split-Path $_ -Leaf)"
          } | Set-Content 'dist/SHA256SUMS-Windows.txt'
          Get-ChildItem dist -File | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: seekye-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish public GitHub Release
    needs: [macos-arm64, windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: seekye-*
          path: release-assets
          merge-multiple: true
      - name: Verify all release files
        shell: bash
        run: |
          set -euo pipefail
          for name in SeekYe-macOS-arm64.dmg SeekYe-macOS-arm64.app.zip seekye-macos-arm64 SeekYe-Windows-x64-Setup.exe SeekYe-Windows-x64-portable.exe SeekYe-Windows-x64-portable.zip SHA256SUMS-macOS.txt SHA256SUMS-Windows.txt; do
            test -s "release-assets/$name" || { echo "Missing $name"; exit 1; }
          done
          ls -lah release-assets
      - name: Publish tagged release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --title "SeekYe $GITHUB_REF_NAME" \
              --generate-notes --latest
          fi
