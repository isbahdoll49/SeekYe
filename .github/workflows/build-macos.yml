name: SeekYe macOS arm64
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Package ARM64 app and DMG
        run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: SeekYe-macOS-arm64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app/**
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg --generate-notes --title "SeekYe ${GITHUB_REF_NAME}" || gh release upload "${GITHUB_REF_NAME}" src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg --clobber
