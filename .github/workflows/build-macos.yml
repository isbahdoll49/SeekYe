name: SeekYe macOS ARM64

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Rust ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check runner architecture
        shell: bash
        run: |
          echo "Runner architecture: $(uname -m)"
          test "$(uname -m)" = arm64

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build SeekYe macOS ARM64 app and DMG
        run: bun run desktop:build

      - name: Collect application and binary artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          echo 'Tauri bundle candidates:'
          find src-tauri/target -type d -name '*.app' -print || true
          find src-tauri/target -type f -name '*.dmg' -print || true

          APP="$(find src-tauri/target -type d -name 'SeekYe.app' -print -quit)"
          test -n "$APP" || { echo 'ERROR: SeekYe.app not found'; exit 1; }
          test -f "$APP/Contents/MacOS/seekye" || { echo 'ERROR: app executable missing'; exit 1; }

          # ditto preserves macOS bundle structure and executable permissions.
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/SeekYe-macOS-arm64.app.zip
          cp "$APP/Contents/MacOS/seekye" dist/seekye-macos-arm64
          chmod +x dist/seekye-macos-arm64

          DMG="$(find src-tauri/target -type f -name '*.dmg' -print -quit)"
          test -n "$DMG" || { echo 'ERROR: DMG not found'; exit 1; }
          cp "$DMG" dist/SeekYe-macOS-arm64.dmg

          shasum -a 256 dist/* > dist/SHA256SUMS.txt
          echo 'Prepared artifacts:'
          ls -lh dist/
          file dist/seekye-macos-arm64

      - name: Upload macOS ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SeekYe-macOS-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --generate-notes --title "SeekYe $GITHUB_REF_NAME"
          fi
